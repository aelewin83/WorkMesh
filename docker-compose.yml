services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: relai
      POSTGRES_USER: relai
      POSTGRES_PASSWORD: relai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relai -d relai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - relai-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  relai-postgres:
