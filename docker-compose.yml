services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workmesh
      POSTGRES_USER: workmesh
      POSTGRES_PASSWORD: workmesh
    ports:
      - "5432:5432"
    volumes:
      - workmesh-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  workmesh-postgres:
