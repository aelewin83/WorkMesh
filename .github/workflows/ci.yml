name: WorkMesh CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: API contract tests
        run: pnpm test:api

      - name: Smart contract tests
        run: pnpm test:contracts

      - name: Build web API mode
        run: pnpm build:web:api

      - name: Build web mock mode
        run: pnpm build:web:mock
